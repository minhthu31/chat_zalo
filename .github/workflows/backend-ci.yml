
name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: chat_zalo_test
          POSTGRES_USER: chat_zalo
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat_zalo -d chat_zalo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHAT_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=chat_zalo_test;Username=chat_zalo;Password=ci_test_password

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend
        run: dotnet restore backend/Chat.sln

      - name: Build Backend
        run: dotnet build backend/Chat.sln --no-restore --configuration Release

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.14

      - name: Migrate test database
        run: >-
          dotnet ef database update
          --project backend/Chat.Infrastructure
          --startup-project backend/Chat.Api
          --configuration Release --no-build
          --connection "$CHAT_TEST_CONNECTION_STRING"

      - name: Test Backend
        run: dotnet test backend/Chat.sln --no-build --no-restore --configuration Release
