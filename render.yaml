services:
  - type: web
    name: nhantin
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Render.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nhantin-db
          property: connectionString

databases:
  - name: nhantin-db
    plan: free
    region: singapore
    ipAllowList: []
